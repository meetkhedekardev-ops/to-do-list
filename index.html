<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-layout">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h2 class="app-logo">✓ <span>My Tasks</span></h2>

          <button
            type="button"
            id="sidebarToggle"
            class="icon-button"
            aria-label="Collapse sidebar"
            title="Collapse sidebar"
          >
            ☰
          </button>
        </div>

        <button type="button" id="openAddTask" class="add-task-button">
          <span>＋</span>
          <span class="sidebar-label">Add task</span>
        </button>

        <div class="sidebar-navigation">
          <button type="button" id="openSearch" class="nav-item">
            <span class="nav-icon">⌕</span>
            <span class="sidebar-label">Search</span>
          </button>

          <button type="button" id="navInbox" class="nav-item active">
            <span class="nav-icon">▣</span>
            <span class="sidebar-label">Inbox</span>
          </button>

          <button type="button" id="navToday" class="nav-item">
            <span class="nav-icon">▦</span>
            <span class="sidebar-label">Today</span>
          </button>

          <button type="button" id="navUpcoming" class="nav-item">
            <span class="nav-icon">▤</span>
            <span class="sidebar-label">Upcoming</span>
          </button>
        </div>

        <div class="sidebar-footer">
          <span class="sidebar-label">My To-Do List</span>
        </div>
      </aside>

      <!-- Main workspace -->
      <main class="workspace">
        <header class="workspace-header">
          <h1 id="pageTitle">Inbox</h1>

          <div class="workspace-actions">
            <button type="button" id="workspaceSearch" class="icon-button">
              Search
            </button>
          </div>
        </header>

        <!-- Task creation form -->
        <form id="taskForm" class="task-form">
          <input
            type="text"
            id="taskInput"
            class="form-control"
            placeholder="Task name"
            required
          />

          <div class="task-form-options">
            <select id="taskPriority" class="form-select">
              <option value="low">Low priority</option>
              <option value="medium" selected>Medium priority</option>
              <option value="high">High priority</option>
            </select>

            <input
              type="date"
              id="taskDueDate"
              class="form-control"
              aria-label="Due date"
            />

            <button type="submit" class="add-task-button">Add task</button>
            <button type="button" id="cancelTask" class="text-button">
              Cancel
            </button>
          </div>
        </form>

        <!-- Task list -->
        <section class="tasks-section">
          <div class="task-toolbar">
            <div class="task-filters">
              <button type="button" id="filterAll" class="filter-button active">
                All
              </button>
              <button type="button" id="filterActive" class="filter-button">
                Active
              </button>
              <button type="button" id="filterCompleted" class="filter-button">
                Completed
              </button>
            </div>

            <button type="button" id="clearCompleted" class="text-button">
              Clear completed
            </button>
          </div>

          <input
            type="search"
            id="searchInput"
            class="form-control search-input"
            placeholder="Search tasks..."
            aria-label="Search tasks"
          />

          <ul id="taskList" class="list-group"></ul>

          <p id="emptyState" class="empty-state">
            No tasks yet. Add your first task to get started!
          </p>
        </section>

        <!-- Task statistics -->
        <section class="task-statistics">
          <div class="stat-item">
            <span>Active</span>
            <strong id="activeCount">0</strong>
          </div>

          <div class="stat-item">
            <span>Completed</span>
            <strong id="completedCount">0</strong>
          </div>

          <span id="taskCount" hidden>0 tasks</span>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
